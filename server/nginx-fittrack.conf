# /etc/nginx/conf.d/fittrack.conf
#
# Run certbot AFTER installing this file:
#
#     sudo nginx -t && sudo systemctl reload nginx
#     sudo certbot --nginx -d fittrack.tecisfun.cloud
#
# certbot rewrites the first block below into a TLS one and adds the redirect.
# Do not hand-write the ssl_certificate lines; letting certbot own them is what
# keeps renewal working unattended.

# ---------------------------------------------------------------- the app
# The name the app actually talks to. It must be a real domain, not the bare
# IP: Android rejects a certificate whose name does not match, and no
# certificate authority will issue one for an IP address.
server {
    listen 80;
    listen [::]:80;
    server_name fittrack.tecisfun.cloud;

    include /etc/nginx/snippets/fittrack-routes.conf;
}

# ------------------------------------------------- plain HTTP, debug only
# Kept so a debug build pointed at the hostname or the raw IP still works while
# you are testing. A release build will not use these -- it refuses cleartext.
# Delete this block once everything is on https.
server {
    listen 80;
    listen [::]:80;
    server_name srv1236384.hstgr.cloud 147.93.55.224;

    include /etc/nginx/snippets/fittrack-routes.conf;
}
