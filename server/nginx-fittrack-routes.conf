# /etc/nginx/snippets/fittrack-routes.conf
#
# Shared by every FitTrack server block, so the TLS one and the debug HTTP one
# can never drift apart -- which is exactly how a hardening rule ends up
# applied on one and quietly missing on the other.

# Must be at least the service's own 8 MB cap, otherwise nginx rejects first
# with a 413 the app cannot explain.
client_max_body_size 10m;

# Upload endpoints and health check, proxied to the Node service.
location /avatar {
    proxy_pass http://127.0.0.1:3001;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location /post-image {
    proxy_pass http://127.0.0.1:3001;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location /health {
    proxy_pass http://127.0.0.1:3001;
    proxy_set_header Host $host;
}

# ------------------------------------------------------------ stored images
# Served straight off disk, never through Node. Both directories sit outside
# any web root, so nothing else in the tree is reachable.

location /avatars/ {
    alias /var/lib/fittrack/avatars/;
    autoindex off;
    add_header Cache-Control "public, max-age=86400";

    # Nothing under here is ever executed or interpreted, whatever it claims
    # to be. This is the line that stops an upload becoming code execution.
    default_type image/jpeg;
    types { image/jpeg jpg jpeg; }
}

location /post-images/ {
    alias /var/lib/fittrack/posts/;
    autoindex off;

    # A post image is written once under a random name and never replaced, so
    # unlike an avatar it can be cached permanently.
    add_header Cache-Control "public, max-age=31536000, immutable";

    default_type image/jpeg;
    types { image/jpeg jpg jpeg; }
}
