# /etc/nginx/conf.d/fittrack.conf
#
# HTTP-only, for getting the upload working before the certificate exists.
# Replace with the TLS version in DEPLOY.md once certbot has run -- the app
# only accepts plain HTTP in debug builds, so a release build will not work
# against this.

server {
    listen 80;
    listen [::]:80;
    # Both names, so testing works whether the app uses the hostname or
    # the bare IP. Without the IP here, requests to it fall through to
    # nginx's default server and 404.
    server_name srv1236384.hstgr.cloud 147.93.55.224;

    # Must be at least the service's own 8 MB cap, otherwise nginx rejects
    # first with a 413 the app cannot explain.
    client_max_body_size 10m;

    # The upload endpoint and health check, proxied to the Node service.
    location /avatar {
        proxy_pass http://127.0.0.1:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /health {
        proxy_pass http://127.0.0.1:3001;
        proxy_set_header Host $host;
    }

    # The stored images, served straight off disk.
    location /avatars/ {
        alias /var/lib/fittrack/avatars/;
        autoindex off;
        add_header Cache-Control "public, max-age=86400";

        # Nothing under here is ever executed or interpreted, whatever it
        # claims to be. This is the line that stops an upload becoming code
        # execution.
        default_type image/jpeg;
        types { image/jpeg jpg jpeg; image/png png; }
    }
}
